arch:
  H_cycles: 3
  H_layers: 0
  L_cycles: 4
  L_layers: 2
  expansion: 4
  fix_mu: false
  fix_std: false
  forward_dtype: bfloat16
  free_bits: null
  halt_exploration_prob: 0.1
  halt_max_steps: 16
  hidden_size: 512
  image_size: 28
  in_channels: 1
  kl_balance_alpha: 0.8
  kl_coef: 0.07
  latent_dim: 256
  loss:
    free_bits: null
    kl_balance_alpha: 0.8
    kl_coef: 0.07
    loss_type: stablemax_cross_entropy
    name: losses@ACTLossHead
    value_coef: 1.0
  mlp_t: false
  name: recursive_reasoning.gram@GenerativeRecursiveReasoningModel
  no_ACT_continue: true
  num_heads: 8
  patch_size: 2
  pos_encodings: rope
  puzzle_emb_len: 16
  puzzle_emb_ndim: 512
  use_mlp_lm_head: true
  use_mlp_sampler: true
  use_patchify: false
  use_value_head: false
  value_coef: 1.0
beta1: 0.9
beta2: 0.95
checkpoint_every_eval: true
checkpoint_path: checkpoints/Nqueens-8-ACT-torch/pretrain_att_gram_nqueens_8
data_paths:
- data/nqueens-8
data_paths_test: []
ema: true
ema_rate: 0.999
epochs: 5000
eval_interval: 50
eval_save_outputs: []
evaluators: []
freeze_weights: false
global_batch_size: 768
load_checkpoint: null
lr: 0.0001
lr_min_ratio: 1.0
lr_warmup_steps: 2000
max_grad_norm: null
min_eval_interval: 0
project_name: Nqueens-8-ACT-torch
puzzle_emb_lr: 0.0001
puzzle_emb_weight_decay: 1.0
run_name: pretrain_att_gram_nqueens_8
seed: 42
wandb_offline: false
weight_decay: 1.0
